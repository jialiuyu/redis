<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">hpc-redis bench tcp / proxy / SuperNode architecture</title>
  <desc id="desc">VEMB V16 TCP bench, proxy I/O worker pool, shard queues, SuperNode worker pool, storage and per-channel completion ring architecture.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="clientGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="proxyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="superGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .group-title { font: 700 22px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .node-title { font: 700 18px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .node-text { font: 400 15px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 400 13px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .label { font: 600 14px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #1e40af; }
      .box { stroke: #94a3b8; stroke-width: 1.5; rx: 16; filter: url(#shadow); }
      .worker { fill: #ffffff; stroke: #93c5fd; stroke-width: 1.4; rx: 12; }
      .super-worker { fill: #ffffff; stroke: #86efac; stroke-width: 1.4; rx: 12; }
      .queue { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; rx: 14; }
      .storage { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; rx: 14; }
      .completion { fill: #fefce8; stroke: #eab308; stroke-width: 1.5; rx: 14; }
      .arrow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .arrow-blue { stroke: #2563eb; stroke-width: 2.6; fill: none; marker-end: url(#arrowBlue); }
      .dash { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="80" y="72" class="title">hpc-redis bench(tcp) / proxy / SuperNode 最新架构</text>
  <text x="80" y="104" class="subtitle">VEMB V16 pooled-only 主路径：TCP 接入、proxy I/O worker 池、SPSC shard queue、SuperNode worker 池与 per-channel completion 边界</text>

  <rect x="80" y="150" width="310" height="130" class="box" fill="url(#clientGrad)"/>
  <text x="110" y="190" class="node-title">bench / CLI TCP workers</text>
  <text x="110" y="222" class="node-text">persistent TCP connection</text>
  <text x="110" y="248" class="node-text">pipeline request / response</text>

  <rect x="510" y="150" width="360" height="130" class="box" fill="#f8fafc"/>
  <text x="540" y="190" class="node-title">accept / control main thread</text>
  <text x="540" y="222" class="node-text">accept fd, HELLO / WELCOME</text>
  <text x="540" y="248" class="node-text">channel lifecycle, close / stats</text>

  <path d="M390 215 L510 215" class="arrow-blue"/>
  <text x="416" y="198" class="label">TCP frame</text>

  <rect x="80" y="350" width="650" height="280" class="box" fill="url(#proxyGrad)"/>
  <text x="110" y="390" class="group-title">proxy I/O worker pool</text>
  <text x="110" y="420" class="small">Linux: per-worker epoll + eventfd; non-Linux: poll fallback</text>

  <rect x="110" y="455" width="180" height="125" class="worker"/>
  <text x="130" y="490" class="node-title">worker 0</text>
  <text x="130" y="520" class="node-text">parse request</text>
  <text x="130" y="544" class="node-text">dispatch job</text>
  <text x="130" y="568" class="node-text">write response</text>

  <rect x="315" y="455" width="180" height="125" class="worker"/>
  <text x="335" y="490" class="node-title">worker 1</text>
  <text x="335" y="520" class="node-text">drain completion</text>
  <text x="335" y="544" class="node-text">backlog flush</text>
  <text x="335" y="568" class="node-text">EPOLLOUT</text>

  <rect x="520" y="455" width="180" height="125" class="worker"/>
  <text x="540" y="490" class="node-title">worker N-1</text>
  <text x="540" y="520" class="node-text">multi fd</text>
  <text x="540" y="544" class="node-text">bounded scan</text>
  <text x="540" y="568" class="node-text">stats</text>

  <path d="M690 280 C690 320 405 315 405 350" class="arrow"/>
  <text x="500" y="325" class="label">assign fd / channel</text>

  <rect x="850" y="350" width="300" height="280" class="box" fill="#fff7ed"/>
  <text x="880" y="390" class="group-title">SPSC shard queues</text>
  <text x="880" y="420" class="small">proxy_worker x supernode_worker</text>

  <rect x="890" y="465" width="220" height="65" class="queue"/>
  <text x="920" y="505" class="node-title">VEMB shard queues</text>

  <rect x="890" y="545" width="220" height="65" class="queue"/>
  <text x="920" y="579" class="node-title">VADD shard queues</text>
  <text x="920" y="601" class="small">full-vector payload</text>

  <path d="M730 500 L850 500" class="arrow-blue"/>
  <text x="752" y="482" class="label">publish job</text>

  <rect x="1250" y="350" width="270" height="280" class="box" fill="url(#superGrad)"/>
  <text x="1280" y="390" class="group-title">SuperNode worker pool</text>
  <text x="1280" y="420" class="small">job wakeup uses worker-local eventfd</text>

  <rect x="1280" y="455" width="210" height="70" class="super-worker"/>
  <text x="1300" y="488" class="node-title">worker 0</text>
  <text x="1300" y="512" class="node-text">TLC read/write, load vector</text>

  <rect x="1280" y="540" width="210" height="70" class="super-worker"/>
  <text x="1300" y="573" class="node-title">worker M-1</text>
  <text x="1300" y="597" class="node-text">publish completion</text>

  <path d="M1150 500 L1250 500" class="arrow-blue"/>
  <text x="1168" y="482" class="label">poll job</text>

  <rect x="1180" y="720" width="340" height="125" class="storage"/>
  <text x="1210" y="760" class="node-title">storage / TLC / WARM vector region</text>
  <text x="1210" y="792" class="node-text">warm provider, TLC, vector metadata</text>
  <text x="1210" y="818" class="node-text">bitmap CAS, table lookup, vector load</text>

  <path d="M1385 630 L1385 720" class="arrow"/>
  <text x="1403" y="680" class="label">execute</text>

  <rect x="500" y="720" width="380" height="125" class="completion"/>
  <text x="530" y="760" class="node-title">per-channel completion ring</text>
  <text x="530" y="792" class="node-text">response ordering boundary</text>
  <text x="530" y="818" class="node-text">slow-client backlog / close protocol</text>

  <path d="M1250 590 C1060 710 1000 782 880 782" class="arrow"/>
  <text x="1010" y="714" class="label">completion</text>

  <path d="M500 782 C325 760 220 650 220 580" class="arrow dash"/>
  <text x="285" y="735" class="label">drain completion</text>

  <path d="M120 455 C35 385 35 250 80 215" class="arrow dash"/>
  <text x="35" y="332" class="label">TCP response</text>

  <rect x="80" y="885" width="1440" height="54" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" rx="12"/>
  <text x="110" y="919" class="small">关键边界：proxy 负责接入与调度；SuperNode 负责 TLC 执行；per-channel 仅保留 completion / backlog / lifecycle；主请求路径统一走 pooled workers + shard queues。</text>
</svg>
