<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="980" viewBox="0 0 1480 980" role="img" aria-labelledby="title desc">
  <title id="title">VEMB V16 SuperNode TLC UB UML class diagram</title>
  <desc id="desc">UML class diagram focused on SuperNode, TLC metadata, warm region selector, warm locations, and UB warm region runtime for the multi UB warm region design.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="diamond" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1,7 L7,1 L13,7 L7,13 Z" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
    </marker>
    <marker id="filledDiamond" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1,7 L7,1 L13,7 L7,13 Z" fill="#334155"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 32px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .class-title { font: 700 18px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .section { font: 400 14px "SFMono-Regular", "Menlo", "Consolas", monospace; fill: #334155; }
      .label { font: 600 14px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #1e3a8a; }
      .mult { font: 700 13px "SFMono-Regular", "Menlo", "Consolas", monospace; fill: #7c3aed; }
      .class-box { stroke: #64748b; stroke-width: 1.6; rx: 8; fill: #ffffff; filter: url(#shadow); }
      .class-head { stroke: #64748b; stroke-width: 1.6; }
      .super-fill { fill: #dcfce7; }
      .tlc-fill { fill: #dbeafe; }
      .selector-fill { fill: #e0e7ff; }
      .region-fill { fill: #fef3c7; }
      .handle-fill { fill: #ede9fe; }
      .assoc { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .agg { stroke: #334155; stroke-width: 2.2; fill: none; marker-start: url(#diamond); }
      .comp { stroke: #334155; stroke-width: 2.2; fill: none; marker-start: url(#filledDiamond); }
      .dep { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1480" height="980" fill="url(#bg)"/>

  <text x="72" y="68" class="title">VEMB V16 SuperNode + TLC + UB UML Class Diagram</text>
  <text x="72" y="100" class="subtitle">只保留 SuperNode 内部 WARM metadata、region selector、location、handle 与 UB warm region runtime</text>

  <g transform="translate(80,150)">
    <rect width="340" height="210" class="class-box super-fill"/>
    <line x1="0" y1="44" x2="340" y2="44" class="class-head"/>
    <line x1="0" y1="128" x2="340" y2="128" class="class-head"/>
    <text x="170" y="29" text-anchor="middle" class="class-title">SuperNode</text>
    <text x="18" y="70" class="section">+ supernode_id: uint32_t</text>
    <text x="18" y="92" class="section">+ local_ub_node_id: uint32_t</text>
    <text x="18" y="114" class="section">+ warm_regions[]</text>
    <text x="18" y="154" class="section">+ warm_put(key, value)</text>
    <text x="18" y="176" class="section">+ warm_get(key_hash)</text>
    <text x="18" y="198" class="section">+ find_region(region_id)</text>
  </g>

  <g transform="translate(500,150)">
    <rect width="350" height="230" class="class-box tlc-fill"/>
    <line x1="0" y1="44" x2="350" y2="44" class="class-head"/>
    <line x1="0" y1="152" x2="350" y2="152" class="class-head"/>
    <text x="175" y="29" text-anchor="middle" class="class-title">TlcCore / WarmMetadata</text>
    <text x="18" y="70" class="section">+ key_to_warm_idx</text>
    <text x="18" y="92" class="section">+ entries[warm_idx]</text>
    <text x="18" y="114" class="section">+ state / lock / access_count</text>
    <text x="18" y="136" class="section">+ eviction_metadata</text>
    <text x="18" y="178" class="section">+ lookup(key_hash): warm_idx</text>
    <text x="18" y="200" class="section">+ publish(idx, location)</text>
    <text x="18" y="222" class="section">+ handle_of(idx): VectorHandle</text>
  </g>

  <g transform="translate(930,150)">
    <rect width="330" height="230" class="class-box selector-fill"/>
    <line x1="0" y1="44" x2="330" y2="44" class="class-head"/>
    <line x1="0" y1="154" x2="330" y2="154" class="class-head"/>
    <text x="165" y="29" text-anchor="middle" class="class-title">WarmRegionSelector</text>
    <text x="18" y="70" class="section">+ vnode_ring[]</text>
    <text x="18" y="92" class="section">+ base_vnodes: uint32_t</text>
    <text x="18" y="114" class="section">+ local_region_weight: uint32_t</text>
    <text x="18" y="136" class="section">+ tried_regions bitmap</text>
    <text x="18" y="180" class="section">+ select(key_hash): region_index</text>
    <text x="18" y="202" class="section">+ fallback(key_hash): region_index</text>
  </g>

  <g transform="translate(500,470)">
    <rect width="320" height="220" class="class-box handle-fill"/>
    <line x1="0" y1="44" x2="320" y2="44" class="class-head"/>
    <line x1="0" y1="164" x2="320" y2="164" class="class-head"/>
    <text x="160" y="29" text-anchor="middle" class="class-title">TlcWarmLocation</text>
    <text x="18" y="70" class="section">+ region_id: uint32_t</text>
    <text x="18" y="92" class="section">+ region_index: uint32_t</text>
    <text x="18" y="114" class="section">+ local_slot: uint32_t</text>
    <text x="18" y="136" class="section">+ bytes: uint32_t</text>
    <text x="18" y="158" class="section">+ offset: uint64_t</text>
    <text x="18" y="190" class="section">+ to_handle(): VectorHandle</text>
  </g>

  <g transform="translate(900,470)">
    <rect width="330" height="410" class="class-box region-fill"/>
    <line x1="0" y1="44" x2="330" y2="44" class="class-head"/>
    <line x1="0" y1="300" x2="330" y2="300" class="class-head"/>
    <text x="165" y="29" text-anchor="middle" class="class-title">WarmRegionRuntime</text>
    <text x="18" y="70" class="section">+ region_id: uint32_t</text>
    <text x="18" y="92" class="section">+ backend_type: shm | ub</text>
    <text x="18" y="114" class="section">+ home_ub_node_id: uint32_t</text>
    <text x="18" y="136" class="section">+ is_local: uint32_t</text>
    <text x="18" y="158" class="section">+ weight: uint32_t</text>
    <text x="18" y="180" class="section">+ value_size: uint32_t</text>
    <text x="18" y="202" class="section">+ capacity_slots: uint32_t</text>
    <text x="18" y="224" class="section">+ next_slot</text>
    <text x="18" y="246" class="section">+ full</text>
    <text x="18" y="268" class="section">+ mapped_addr / region_bytes</text>
    <text x="18" y="290" class="section">+ path / mmap_offset / fd</text>
    <text x="18" y="326" class="section">+ alloc_slot(): local_slot</text>
    <text x="18" y="348" class="section">+ payload_ptr(offset): void*</text>
    <text x="18" y="370" class="section">+ mark_full()</text>
    <text x="18" y="392" class="section">+ contains(offset, bytes)</text>
  </g>

  <g transform="translate(80,500)">
    <rect width="320" height="190" class="class-box handle-fill"/>
    <line x1="0" y1="44" x2="320" y2="44" class="class-head"/>
    <line x1="0" y1="142" x2="320" y2="142" class="class-head"/>
    <text x="160" y="29" text-anchor="middle" class="class-title">VectorHandle</text>
    <text x="18" y="70" class="section">+ region_id: uint32_t</text>
    <text x="18" y="92" class="section">+ bytes: uint32_t</text>
    <text x="18" y="114" class="section">+ offset: uint64_t</text>
    <text x="18" y="136" class="section">+ key_hash: uint64_t</text>
    <text x="18" y="168" class="section">+ is_valid(): bool</text>
  </g>

  <path d="M420 265 L500 265" class="comp"/>
  <text x="442" y="240" class="mult">1</text>
  <text x="470" y="240" class="mult">1</text>

  <path d="M850 265 L930 265" class="comp"/>
  <text x="872" y="248" class="mult">1</text>
  <text x="900" y="248" class="mult">1</text>

  <path d="M1260 265 L1300 265 Q1330 265 1330 295 L1330 530 Q1330 560 1300 560 L1230 560" class="agg"/>
  <text x="1272" y="246" class="mult">1</text>
  <text x="1292" y="430" class="mult">1..*</text>

  <path d="M850 580 L900 580" class="comp"/>
  <text x="862" y="562" class="mult">1</text>
  <text x="878" y="562" class="mult">1..*</text>

  <path d="M820 580 L900 580" class="assoc"/>
  <text x="836" y="610" class="label">locates in</text>

  <path d="M500 590 L400 590" class="assoc"/>
  <text x="418" y="570" class="label">to_handle()</text>

  <path d="M1095 380 L1095 470" class="assoc"/>
  <text x="1110" y="430" class="label">allocates in</text>

  <path d="M250 500 L250 360" class="dep"/>
  <text x="262" y="434" class="label">returned by (non-TCP transport)</text>
</svg>
