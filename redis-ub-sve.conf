# Redis UB+SVE2 Optimized Configuration v10
# Port 6380 — performance-tuned for Kunpeng 920 + Ascend 910C
#
# Real Redis directives only (no custom keys that cause startup failure).
# UB/SVE2/NPU parameters documented in comments for the benchmark framework.

bind 127.0.0.1
port 6380
protected-mode no
daemonize yes
pidfile /tmp/redis-test-ub/redis-ub-sve.pid
loglevel notice
logfile /tmp/redis-test-ub/redis-ub-sve.log
dir /tmp/redis-test-ub
databases 16

# ========================================
# Persistence: disabled for max throughput
# ========================================
save ""
appendonly no

# ========================================
# Memory
# ========================================
maxmemory 4gb
maxmemory-policy allkeys-lru

# ========================================
# Network — tuned for high concurrency
# ========================================
tcp-backlog 4096
tcp-keepalive 300
timeout 0
maxclients 10000

# ========================================
# I/O Threads — Kunpeng multi-core optimization
# ========================================
io-threads 8
io-threads-do-reads yes

# ========================================
# Lazy Free — async memory reclaim
# ========================================
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes

# ========================================
# Event loop frequency — higher = lower latency
# ========================================
hz 100

# ========================================
# Active defrag — reduce fragmentation
# ========================================
activedefrag no

# ========================================
# Slow log
# ========================================
slowlog-log-slower-than 10000
slowlog-max-len 128

# ========================================
# Jemalloc background threads
# ========================================
jemalloc-bg-thread yes
locale-collate "C"

# ========================================
# TLC Module — Three-Layer Cache (UB + SVE2)
# ========================================
loadmodule /sharedata/qiuwu/redis/src/modules/tlc_module.so

# ========================================
# UB/SVE2/NPU Parameters (for benchmark framework, not Redis directives)
# ========================================
# UB Memory: 4 nodes × 2GB, consistent hash with 4x local weight
# SVE2 GEMM: L3-tiled (tile_K=256), 4-row register-blocked
# SVE2 GEMV: 4-accumulator unrolled for cold expert (B=1..4)
# SVE2 Adam: optimizer state offload to CPU UB memory
# NPU: 2× Ascend 910C, FP16 aclblasHgemm
# Event sync: hardware doorbell / MSI-X (pthread cond in benchmark)
# Cold expert threshold: B_cold ≤ 4 → CPU, B ≥ 5 → NPU
# Embedding: 128K × 300 dim in UB memory
#
# Performance baselines (v8/v9):
#   Cache QPS: ~10 M (UB memory backend)
#   SVE2 GEMM: 455 GFLOPS (1K×4K×1K, 20 cores)
#   SVE2 Adam: fully hidden behind NPU Fwd+Bwd
#   NPU GEMM: 27-102K GFLOPS (cold expert, 2 devices)
