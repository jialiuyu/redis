# Redis UB+SVE Configuration
# 超高性能向量引擎配置示例
# 基于设计文档：UB_SVE-redis.pdf 和 design.md

# ========================================
# 基础配置
# ========================================

# 绑定地址
bind 0.0.0.0

# 端口
port 6379

# 守护进程模式
daemonize no

# PID 文件
pidfile /var/run/redis-ub-sve.pid

# 日志级别: debug, verbose, notice, warning
loglevel notice

# 日志文件
logfile /var/log/redis/redis-ub-sve.log

# 数据库数量
databases 16

# ========================================
# 向量引擎配置
# ========================================

# 向量引擎类型: redis (传统 HNSW) 或 ub (UB+SVE 加速)
vector-engine ub

# 向量维度（默认 300）
vector-dimension 300

# ========================================
# Proxy 聚合器配置
# ========================================

# 启用 Proxy 聚合器
proxy-aggregator-enabled yes

# 批量大小限制（3000-6000 推荐）
# 设计目标：积攒 3000 个请求为一批
proxy-batch-limit 3000

# 批量超时时间（微秒）
# 设计目标：200-500μs 微秒级等待
proxy-timeout-us 200

# 超节点数量
# 设计：600TB ÷ 4TB = 150 个超节点
proxy-num-supernodes 150

# 一致性哈希虚拟节点数（每个物理节点）
proxy-hash-virtual-nodes 10

# Ring Buffer 大小（字节）
proxy-ring-buffer-size 16777216  # 16MB

# ========================================
# 超节点配置
# ========================================

# 超节点 ID（0-149）
supernode-id 0

# SVE Worker 线程数（推荐：CPU 核心数）
supernode-num-workers 16

# UB.mem 基地址（物理地址）
supernode-ub-mem-base 0x100000000

# UB.mem 大小
# 设计限制：单超节点 4TB 物理寻址
supernode-ub-mem-size 4398046511104  # 4TB

# UB.mem 页大小（字节）
supernode-ub-mem-page-size 4194304  # 4MB

# Embedding 最大数量
supernode-max-embeddings 1073741824  # 10亿

# ========================================
# SVE 配置
# ========================================

# SVE 向量位宽（256 或 512）
sve-vector-bits 256

# 启用 SVE2 指令
sve2-enabled yes

# 启用非临时内存访问（避免 L3 Cache 污染）
sve-non-temporal-access yes

# SVE Gather/Scatter 批量大小
sve-batch-size 1024

# ========================================
# Bitmap CAS 锁配置
# ========================================

# 启用 Bitmap CAS 无锁并发控制
bitmap-cas-enabled yes

# Bitmap 大小（位数）
# 计算：max_embeddings / 64
bitmap-size 16777216  # 10亿 / 64

# CAS 重试次数
bitmap-cas-retry 3

# ========================================
# 性能优化配置
# ========================================

# 启用大页支持
use-huge-pages yes

# CPU 亲和性绑定
cpu-affinity-enabled yes

# NUMA 节点绑定
numa-node 0

# 预分配内存
preallocate-memory yes

# 零拷贝 I/O
zero-copy-io yes

# ========================================
# 监控和统计
# ========================================

# 启用性能统计
enable-stats yes

# 统计采样间隔（秒）
stats-interval 10

# 慢查询日志阈值（微秒）
slowlog-log-slower-than 100

# 慢查询日志最大长度
slowlog-max-len 128

# ========================================
# 内存管理
# ========================================

# 最大内存限制（字节）
# 注意：不包括 UB.mem
maxmemory 8589934592  # 8GB

# 内存淘汰策略
maxmemory-policy allkeys-lru

# ========================================
# 持久化配置
# ========================================

# 禁用 RDB（向量数据通常不需要持久化）
save ""

# 禁用 AOF
appendonly no

# ========================================
# 网络配置
# ========================================

# TCP backlog
tcp-backlog 511

# TCP keepalive
tcp-keepalive 300

# 超时时间（秒，0 表示禁用）
timeout 0

# 最大客户端连接数
maxclients 10000

# ========================================
# 安全配置
# ========================================

# 要求密码（生产环境必须设置）
# requirepass your_strong_password_here

# 禁用危险命令
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""

# ========================================
# 高级配置
# ========================================

# 启用 lazy free
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# I/O 线程数
io-threads 4
io-threads-do-reads yes

# ========================================
# UB 固件配置
# ========================================

# UB 固件库路径
ub-firmware-lib /usr/lib/libubios.so

# UB Fabric Manager EID
ub-fabric-manager-eid 0x0001

# UB 本地 EID（自动分配）
# ub-local-eid auto

# UB 本地 CNA（自动分配）
# ub-local-cna auto

# UB 连接超时（毫秒）
ub-connect-timeout 5000

# UB 请求超时（毫秒）
ub-request-timeout 1000

# ========================================
# 调试配置
# ========================================

# 启用调试日志
# debug-enabled no

# 调试日志级别
# debug-level 3

# 性能分析
# profile-enabled no

# ========================================
# 实验性功能
# ========================================

# 启用 Double Buffer（减少锁竞争）
# experimental-double-buffer no

# 启用自适应批量大小
# experimental-adaptive-batch-size no

# 启用预取优化
# experimental-prefetch yes

# ========================================
# 注释和说明
# ========================================

# 性能目标：
# - 总吞吐量：240 亿 IOPS
# - 单请求延迟：< 100 μs (P99)
# - 批量大小：3000-6000
# - 批量延迟：200-500 μs
# - 收益比（保守）：2.96x
# - 收益比（目标）：30-100x

# 硬件要求：
# - CPU：鲲鹏 920/930（ARM64 + SVE/SVE2）
# - 内存：4TB UB.mem per 超节点
# - 网络：UB-Mesh 0.2 TB/s 带宽
# - 超节点数量：150 个（600TB 总容量）

# 关键设计：
# 1. Proxy 层智能聚合（蓄水池策略）
# 2. Ring Buffer 零拷贝通信
# 3. 一致性哈希分片
# 4. Bitmap CAS 无锁并发控制
# 5. SVE2 Gather Load 批量并行
# 6. 非临时内存访问（避免 Cache 污染）

# 参考文档：
# - UB_SVE-redis.pdf
# - design.md
# - UB_SVE_INTEGRATION_README.md
