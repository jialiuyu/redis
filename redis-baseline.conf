# Redis Baseline Configuration (stock defaults)
# Port 6379 — vanilla Redis for comparison

bind 127.0.0.1
port 6379
protected-mode no
daemonize yes
pidfile /tmp/redis-test-baseline/redis-baseline.pid
loglevel notice
logfile /tmp/redis-test-baseline/redis-baseline.log
dir /tmp/redis-test-baseline
databases 16
save ""
appendonly no
maxmemory 4gb
maxmemory-policy allkeys-lru
tcp-backlog 511
tcp-keepalive 300
timeout 0
maxclients 10000
locale-collate "C"
