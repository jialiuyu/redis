bind 127.0.0.1
port 6391
protected-mode no
daemonize no
pidfile /tmp/redis-vemb-fc-bench.pid
logfile ""
dir .
save ""
appendonly no

vector-engine ub
vector-dimension 300

ub-table-name myvectors
ub-shm-path /tmp/redis-vemb-fc-bench/ub.mem
ub-shm-size 268435456
ub-table-offset 0
ub-table-size 0
ub-vector-stride-bytes 0
ub-element-index-mode suffix-numeric
ub-cacheable no
ub-use-ownership no

supernode-workers 64
proxy-max-supernodes 1
proxy-batch-limit 64
proxy-time-limit-us 50
proxy-vemb-submit-mode fc
proxy-vemb-adaptive no
proxy-vemb-direct-gap-us 20
proxy-vemb-fc-workers 16
proxy-vemb-fc-slots 0
proxy-vemb-fc-max-scan 0
